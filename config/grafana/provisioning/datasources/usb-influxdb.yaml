apiVersion: 1
datasources:
  - name: USB telemetry
    uid: osprey_usb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      httpMode: POST
    secureJsonData:
      token: $INFLUX_DB_API_TOKEN
