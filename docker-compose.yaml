services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?Set INFLUX_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_DB_API_TOKEN:?Set INFLUX_DB_API_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-osprey-racing}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry-test}
      DOCKER_INFLUXDB_INIT_RETENTION: 0
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
      INFLUX_DB_API_TOKEN: ${INFLUX_DB_API_TOKEN:-}
      INFLUX_ORG: ${INFLUX_ORG:-osprey-racing}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry-test}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:
