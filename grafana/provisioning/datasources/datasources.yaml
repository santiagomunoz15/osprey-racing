apiVersion: 1
datasources:
  - name: Recorded runs
    uid: osprey_csv
    type: postgres
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: osprey
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      timeInterval: 20ms
  - name: Live telemetry
    uid: osprey_live
    type: prometheus
    url: http://prometheus:9090
    editable: false
    jsonData:
      timeInterval: 1s
