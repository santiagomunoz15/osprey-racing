[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osprey-telemetry"
version = "0.1.0"
description = "CAN3 capture, recording and replay for Osprey Racing"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["pyserial>=3.5,<4"]

[project.scripts]
osprey-receive = "osprey_telemetry.live.usb_receiver:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"osprey_telemetry.live" = ["can3_channels.json"]
