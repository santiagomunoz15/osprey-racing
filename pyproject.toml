[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osprey-telemetry"
version = "0.1.0"
description = "Recorded and live telemetry tools for Osprey Racing"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2,<4", "tzdata>=2025.1"]

[project.scripts]
osprey-import = "osprey_telemetry.import_csv:main"

[tool.setuptools.packages.find]
where = ["src"]
